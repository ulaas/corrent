# cargo-deny policy: licenses, advisories, sources. Run with `cargo deny check`.

[graph]
targets = [
    "x86_64-pc-windows-msvc",
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]
all-features = false

[advisories]
# Unmaintained crates deep in the GUI/engine stacks are reported but not fatal.
unmaintained = "workspace"
yanked = "warn"
ignore = [
    # ringbuf 0.4 (via librqbit-utp): double drop only if an element's Drop panics. librqbit-utp
    # stores plain bytes, whose Drop cannot panic. The fix (0.5.2) is semver-incompatible and must
    # come from upstream; revisit on every librqbit upgrade.
    { id = "RUSTSEC-2026-0293", reason = "not reachable: ring buffer holds u8 (non-panicking Drop)" },
]

[licenses]
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "OFL-1.1",
    "BSL-1.0",
    "CC0-1.0",
    "0BSD",
    "MPL-2.0",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "Ubuntu-font-1.0",
    "Unlicense",
]

[licenses.private]
ignore = true

[bans]
multiple-versions = "allow"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
