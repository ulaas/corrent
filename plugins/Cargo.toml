# First-party plugins, built with scripts/build-plugins.sh for wasm32-wasip2. The resulting
# components are committed under crates/corrent-plugins/builtin/ (cargo build of the main
# workspace never needs the wasm target).
[workspace]
members = ["example", "example-subtitles", "example-parser", "example-task", "tmdb", "musicbrainz"]
resolver = "3"

[workspace.dependencies]
wit-bindgen = "0.57"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
