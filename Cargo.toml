[package]
name = "corrent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A beautiful, stable, cross-platform BitTorrent client"
license = "MIT OR Apache-2.0"

[features]
default = []

[dependencies]
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
eframe = { version = "=0.36.2", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "=0.36.2"
egui_extras = "=0.36.2"
egui_plot = "0.37.0"
egui-phosphor = "0.14.0"
arc-swap = "1"
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"
open = "5"
arboard = "3"
url = "2"
fs4 = "1.1.0"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
