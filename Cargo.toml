[package]
name = "corrent"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "A beautiful, stable, cross-platform BitTorrent client"
license = "MIT OR Apache-2.0"
publish = false

[workspace]
members = [".", "crates/*"]
# WebAssembly plugins build for wasm32-wasip2 in their own workspace (scripts/build-plugins.sh).
exclude = ["plugins"]
resolver = "3"

[features]
default = []

[dependencies]
corrent-i18n = { path = "crates/corrent-i18n" }
corrent-core = { path = "crates/corrent-core" }
corrent-server = { path = "crates/corrent-server" }
corrent-proto = { path = "crates/corrent-proto" }
corrent-mpv = { path = "crates/corrent-mpv" }
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs"] }
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "=0.36.2"
egui_extras = "=0.36.2"
egui_plot = "0.37.0"
egui-phosphor = "0.14.0"
arc-swap = "1"
anyhow = "1"
bytes = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rfd = "0.17"
open = "5"
arboard = "3"
notify-rust = "4.18"
url = "2"
feed-rs = { version = "=3.0.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "multipart", "json"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
rustls-platform-verifier = "0.7"
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
base64 = "0.22"
x509-parser = "0.18"
regex = "1.13"
quick-xml = "=0.42.0"
flate2 = "1"
sys-locale = "0.3"
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "multipart", "json"] }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs4 = "1.1.0"
interprocess = "2.4"
zip = { version = "9", default-features = false, features = ["deflate"] }
librqbit-bencode = "=9.0.1"

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
strip = true

[target."cfg(windows)".dependencies]
windows-registry = "0.6"
# Lets Windows builds succeed without NASM installed (prebuilt objects are used instead).
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
raw-window-handle = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
# ksni: pure-Rust StatusNotifierItem tray over D-Bus (no GTK needed at build or run time).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }

[target.'cfg(not(target_os = "linux"))'.dependencies]
tray-icon = { version = "0.26", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSURL", "NSAppleEventManager", "NSAppleEventDescriptor"] }

# `cargo bundle --release` (cargo-bundle) produces Corrent.app with the magnet URL scheme
# and .torrent document type declared, so Launch Services can route them to Corrent.
[package.metadata.bundle]
name = "Corrent"
identifier = "io.github.ulaas.Corrent"
icon = ["assets/icon/corrent-256.png", "assets/icon/corrent-512.png"]
category = "public.app-category.utilities"
short_description = "A beautiful, stable BitTorrent client"
osx_url_name = "Magnet link"
osx_url_schemes = ["magnet"]
osx_info_plist_exts = ["packaging/macos/Info.plist.ext"]
linux_mime_types = ["x-scheme-handler/magnet", "application/x-bittorrent"]

[patch.crates-io]
# Keeps the DHT alive on Windows; see vendor/librqbit-dht/CORRENT-PATCH.md.
librqbit-dht = { path = "vendor/librqbit-dht" }
librqbit = { path = "vendor/librqbit" }

[build-dependencies]
winresource = "0.1"

[dev-dependencies]
corrent-core = { path = "crates/corrent-core", features = ["testkit"] }
corrent-db = { path = "crates/corrent-db" }
corrent-library = { path = "crates/corrent-library" }
egui_kittest = "=0.36.2"
