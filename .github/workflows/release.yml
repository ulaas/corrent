name: Release

# Builds installers when a version tag is pushed (the owner pushes tags; nothing here pushes).
# The release is published when every installer is built (a tag with a hyphen, such as
# v1.0.0-rc.1, as a pre-release). Package manifests follow from package-manifests.yml.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      skip_ci_gate:
        description: "Build without waiting for a green CI run on this commit (emergencies only)"
        type: boolean
        default: false

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write

jobs:
  # Waits for ci.yml on the same commit, so the commit and the tag can be pushed together: the
  # builds start once a CI run on that commit is green. Fails if CI fails or is cancelled, or if
  # no CI run shows up for the commit within 10 minutes.
  ci-gate:
    name: Wait for CI on this commit
    runs-on: ubuntu-latest
    timeout-minutes: 240
    permissions:
      actions: read
    steps:
      - name: Wait for a green CI run
        if: inputs.skip_ci_gate != true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          waited=0
          while :; do
            runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=50" \
              --jq '[.workflow_runs[] | {status, conclusion, url: .html_url}]')
            total=$(jq length <<<"$runs")
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed on $SHA: $(jq -r 'first(.[] | select(.conclusion == "success") | .url)' <<<"$runs")"
              exit 0
            fi
            if (( total > 0 )) && ! jq -e 'any(.[]; .status != "completed")' <<<"$runs" >/dev/null; then
              echo "::error::CI did not pass on $SHA (re-run it, then re-run this release):"
              jq -r '.[] | "  \(.conclusion): \(.url)"' <<<"$runs"
              exit 1
            fi
            if (( total == 0 && waited >= 600 )); then
              echo "::error::No CI run for $SHA after 10 minutes. Push the commit to main first (or run CI on it by hand)."
              exit 1
            fi
            echo "Waiting for CI on $SHA ($total run(s), ${waited}s so far)"
            sleep 60; waited=$((waited + 60))
          done
      - name: CI gate skipped
        if: inputs.skip_ci_gate == true
        run: echo "::warning::Release built without waiting for CI (skip_ci_gate)."

  windows:
    needs: ci-gate
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install WiX 3 and cargo-wix
        run: |
          choco install wixtoolset --version 3.14.1 -y --no-progress
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH
          cargo install cargo-wix --locked
      - name: Portable zip and MSI
        run: powershell -File scripts/package-windows.ps1 -Msi
      # Crash reports must resolve to file:line with this profile's PDBs (O2).
      - name: Symbols check
        run: cargo run --release --locked -p corrent-core --example symbols_check
      - name: winget manifests
        shell: pwsh
        run: |
          # Tag builds use the tag; manual runs use the version in Cargo.toml.
          $version = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}".TrimStart('v') } else { (Select-String -Path Cargo.toml -Pattern '^version = "(.*)"' | Select-Object -First 1).Matches[0].Groups[1].Value }
          $msi = Get-ChildItem dist/*.msi | Select-Object -First 1
          $sha = (Get-FileHash $msi -Algorithm SHA256).Hash
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/$($msi.Name)"
          New-Item -ItemType Directory -Force dist/winget | Out-Null
          Get-ChildItem packaging/windows/winget/*.yaml | ForEach-Object {
            (Get-Content $_) -replace '\{\{VERSION\}\}', $version -replace '\{\{URL\}\}', $url -replace '\{\{SHA256\}\}', $sha |
              Set-Content (Join-Path dist/winget $_.Name)
          }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/**
      # Not shipped: crash reports carry addresses that only these exact files resolve
      # (scripts/symbolize.ps1). LTO builds aren't reproducible, so keep them with each release.
      - uses: actions/upload-artifact@v4
        with:
          name: symbols-windows
          path: |
            target/release/corrent.exe
            target/release/corrent.pdb
            target/release/correntd.exe
            target/release/correntd.pdb

  linux:
    needs: ci-gate
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build dependencies
        run: sudo apt-get -o Acquire::Retries=5 update && sudo apt-get -o Acquire::Retries=5 install -y libudev-dev libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev libfuse2
      - name: linuxdeploy
        run: |
          curl -fsSLo linuxdeploy https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy
      - name: AppImage
        run: LINUXDEPLOY=./linuxdeploy scripts/package-appimage.sh
      - name: Plain tarball
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          tar -C target/release -czf "dist/Corrent-$version-linux-x86_64.tar.gz" corrent corrent-mpvw
      - name: Server tarball
        run: scripts/package-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/**

  macos:
    needs: ci-gate
    # Apple silicon only (the packages are arm64).
    runs-on: macos-15
    env:
      # `secrets` can't be used in step conditions directly.
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # libmpv and its libraries go into the app and the server pkg (scripts/package-macos.sh).
      - run: brew install mpv dylibbundler
      # Developer ID signing and notarization when the repository has the secrets (forks and
      # pull requests don't); without them the app is signed ad hoc. The certificate and an App
      # Store Connect API key go into a temporary keychain, as the notarytool profile ci-notary.
      - name: Import the Developer ID certificate and the notary key
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          IDENTITY: ${{ secrets.MACOS_CODESIGN_IDENTITY }}
          NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY_P8 }}
          NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          NOTARY_ISSUER: ${{ secrets.MACOS_NOTARY_ISSUER }}
          INSTALLER_P12: ${{ secrets.MACOS_INSTALLER_CERTIFICATE_P12 }}
          INSTALLER_IDENTITY: ${{ secrets.MACOS_INSTALLER_IDENTITY }}
        shell: bash
        run: |
          set -euo pipefail
          kc="$RUNNER_TEMP/signing.keychain-db"
          kc_pw="$(uuidgen)"
          security create-keychain -p "$kc_pw" "$kc"
          security set-keychain-settings -lut 21600 "$kc"
          security unlock-keychain -p "$kc_pw" "$kc"
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"
          if [ -n "$INSTALLER_P12" ]; then
            printf '%s' "$INSTALLER_P12" | base64 --decode > "$RUNNER_TEMP/installer.p12"
            security import "$RUNNER_TEMP/installer.p12" -k "$kc" -P "$P12_PASSWORD" -f pkcs12 \
              -T /usr/bin/productbuild -T /usr/bin/productsign -T /usr/bin/pkgbuild
            rm -f "$RUNNER_TEMP/installer.p12"
            echo "MACOS_INSTALLER_IDENTITY=$INSTALLER_IDENTITY" >> "$GITHUB_ENV"
          fi
          security set-key-partition-list -S apple-tool:,apple: -s -k "$kc_pw" "$kc" > /dev/null
          security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
          security find-identity -v -p codesigning "$kc" | grep -qF "$IDENTITY"
          printf '%s\n' "$NOTARY_KEY" > "$RUNNER_TEMP/notary.p8"
          xcrun notarytool store-credentials ci-notary --key "$RUNNER_TEMP/notary.p8" \
            --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$kc"
          rm -f "$RUNNER_TEMP/notary.p8"
          {
            echo "MACOS_SIGN_IDENTITY=$IDENTITY"
            echo "MACOS_NOTARY_PROFILE=ci-notary"
          } >> "$GITHUB_ENV"
      - name: App bundle, dmg and server pkg
        run: scripts/package-macos.sh
      - name: Gatekeeper accepts the notarized disk image
        if: env.HAS_SIGNING == 'true'
        shell: bash
        run: spctl --assess --type open --context context:primary-signature --verbose=2 dist/*.dmg
      - name: Remove the temporary keychain
        if: always() && env.HAS_SIGNING == 'true'
        shell: bash
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
      - name: The server pkg is signed for distribution
        if: env.HAS_SIGNING == 'true'
        run: |
          for pkg in dist/*.pkg; do
            pkgutil --check-signature "$pkg"
            spctl --assess --type install --verbose=2 "$pkg"
          done
      - name: Server tarball
        run: scripts/package-server.sh
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/**

  release:
    needs: [windows, linux, macos]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      # The release text is this version's section of CHANGELOG.md.
      - name: Release notes
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v h="## [$v]" 'index($0, h) == 1 {on=1; next} /^## \[/ && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for $v"; exit 1; }
      - name: Checksums
        run: |
          mkdir -p upload
          cp artifacts/windows/*.zip artifacts/windows/*.msi artifacts/linux/*.AppImage artifacts/linux/*.tar.gz             artifacts/macos/*.dmg artifacts/macos/*.pkg artifacts/macos/*.tar.gz upload/
          (cd upload && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt)
      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          body_path: notes.md
          files: upload/*
