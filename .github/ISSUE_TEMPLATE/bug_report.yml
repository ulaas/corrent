name: Bug report
description: Something doesn't work as it should
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Add the Sintel torrent
        2. …
  - type: input
    id: version
    attributes:
      label: Version
      description: ⋮ → About, or `corrent --version`.
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options: [Windows, Linux, macOS]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or diagnostics
      description: >
        ⋮ → Save diagnostics… makes a zip without passwords, keys or your torrent list; attach it
        or paste the relevant lines. Please don't paste private tracker links.
