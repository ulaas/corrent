name: Feature request
description: An idea to make Corrent better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: The problem or the wish, in your own words.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
