"The engine's torrent list was lost and no saved copy was usable, and no torrent files were left to rebuild it from: the engine starts with an empty list." = "Motorun torrent listesi kayboldu, kullanılabilir kayıtlı bir kopya yoktu ve listeyi yeniden oluşturmak için hiç torrent dosyası kalmamıştı: motor boş bir listeyle başlıyor."
"Its torrent file is missing. Retry looks for it on the network." = "Torrent dosyası eksik. «Yeniden dene» onu ağda arar."
"The engine's torrent list was lost and no saved copy was usable, so it was rebuilt from the torrent files and Corrent's records. Its torrent was stopped (paused): when resumed, it checks its data and downloads only what is missing." = "Motorun torrent listesi kayboldu ve kullanılabilir kayıtlı bir kopya yoktu; bu yüzden liste torrent dosyalarından ve Corrent'in kayıtlarından yeniden oluşturuldu. Torrent durduruldu (duraklatıldı): devam ettirildiğinde verisini denetler ve yalnızca eksik olanı indirir."
"The engine's torrent list was lost and no saved copy was usable, so it was rebuilt from the torrent files and Corrent's records. Its {n} torrents were stopped (paused): when resumed, they check their data and download only what is missing." = "Motorun torrent listesi kayboldu ve kullanılabilir kayıtlı bir kopya yoktu; bu yüzden liste torrent dosyalarından ve Corrent'in kayıtlarından yeniden oluşturuldu. {n} torrent durduruldu (duraklatıldı): devam ettirildiklerinde verilerini denetler ve yalnızca eksik olanı indirirler."
"One of them had no recorded folder and was put in the download folder: move it to its data before resuming it." = "Bunlardan birinin kayıtlı bir klasörü yoktu ve indirme klasörüne kondu: devam ettirmeden önce onu verisinin bulunduğu yere taşıyın."
"{k} of them had no recorded folder and were put in the download folder: move them to their data before resuming them." = "Bunlardan {k} tanesinin kayıtlı bir klasörü yoktu ve indirme klasörüne kondu: devam ettirmeden önce onları verilerinin bulunduğu yere taşıyın."
