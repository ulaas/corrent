"The engine's torrent list ({path}) is damaged or missing, no usable copy was found, and Corrent's own records can't be read right now to rebuild it. The torrent engine doesn't start, so nothing is lost; restart Corrent to try again." = "Motorun torrent listesi ({path}) hasarlı veya eksik, kullanılabilir bir kopya bulunamadı ve Corrent'in kendi kayıtları listeyi yeniden oluşturmak için şu anda okunamıyor. Torrent motoru başlatılmıyor, böylece hiçbir şey kaybolmuyor; yeniden denemek için Corrent'i yeniden başlatın."
