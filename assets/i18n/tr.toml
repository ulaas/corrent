"{k} torrents' files are missing; they show as errors with Retry." = "{k} torrentin dosyası eksik; «Yeniden dene» seçeneğiyle hata olarak gösteriliyorlar."
"The engine's torrent list was damaged and was restored from a copy saved {date}. Its {n} torrents were stopped (paused), because their folders may have changed since; resume them after a look. Torrents added after that copy are missing, but their categories and tags were kept. The damaged file was kept next to it." = "Motorun torrent listesi hasarlıydı ve {date} tarihinde kaydedilen bir kopyadan geri yüklendi. Klasörleri o zamandan beri değişmiş olabileceğinden {n} torrent durduruldu (duraklatıldı); göz attıktan sonra devam ettirin. O kopyadan sonra eklenen torrentler listede yok, ancak kategorileri ve etiketleri korundu. Hasarlı dosya yanına kaydedildi."
"The file was renamed to {name} so it isn't added again." = "Dosya tekrar eklenmemesi için {name} olarak yeniden adlandırıldı."
