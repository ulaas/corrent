[package]
name = "corrent-core"
version = "0.3.1"
edition = "2024"
rust-version = "1.96"
description = "Corrent's engine (librqbit actor), settings, per-torrent store, RSS, search and maintenance"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[features]
# Loopback seeder/leecher helpers for integration tests in other crates.
testkit = []
# Fuzz target bodies (`corrent_core::fuzz`, STABILITY.md Z): for the `fuzz/` cargo-fuzz crate.
# Test tooling like the test kit, which it brings along.
fuzz = ["testkit", "dep:librqbit-peer-protocol", "dep:librqbit-dht"]

# The durability harness (STABILITY.md D8): test tooling, built only with the test kit.
[[bin]]
name = "corrent-harness"
required-features = ["testkit"]

[[test]]
name = "durability"
required-features = ["testkit"]

[dependencies]
corrent-i18n = { path = "../corrent-i18n" }
corrent-proto = { path = "../corrent-proto" }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-bencode = "=9.0.1"
librqbit-core = { version = "=9.0.1", default-features = false }
# Only for the fuzz targets (Z2): the peer wire protocol and the DHT's messages.
librqbit-peer-protocol = { version = "=9.0.1", optional = true }
librqbit-dht = { version = "=9.0.1", optional = true }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
tokio-util = "0.7.19"
arc-swap = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
url = "2"
feed-rs = { version = "=3.0.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
regex = "1.13"
quick-xml = "=0.42.0"
flate2 = "1"
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs4 = "1.1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }
# Raw frame addresses for crash reports and resolving them later (symbols.rs).
backtrace = "0.3"

[target."cfg(windows)".dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

[dev-dependencies]
corrent-fuzz = { path = "../corrent-fuzz" }
proptest = { version = "1.12", default-features = false, features = ["std"] }
librqbit-peer-protocol = "=9.0.1"
librqbit-dht = "=9.0.1"
