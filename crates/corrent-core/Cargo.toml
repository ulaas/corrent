[package]
name = "corrent-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Corrent's engine (librqbit actor), settings, per-torrent store, RSS, search and maintenance"
license = "MIT OR Apache-2.0"
publish = false

[features]
# Loopback seeder/leecher helpers for integration tests in other crates.
testkit = []

[dependencies]
corrent-i18n = { path = "../corrent-i18n" }
librqbit = { version = "=9.0.1", default-features = false, features = ["rust-tls"] }
librqbit-bencode = "=9.0.1"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net", "io-util"] }
arc-swap = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
directories = "6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
open = "5"
url = "2"
feed-rs = { version = "=3.0.0", default-features = false }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form"] }
regex = "1.13"
quick-xml = "=0.42.0"
flate2 = "1"
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }
chrono = { version = "0.4", default-features = false, features = ["std"] }
fs4 = "1.1.0"
zip = { version = "9", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }
