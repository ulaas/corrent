lsd = false
trackers_enabled = false
default_trackers = []
fastresume = true

[queue]
enabled = false
max_active_downloads = 4
max_active_uploads = 10
max_active_total = 15
ignore_slow = true
slow_down_kib = 2
slow_up_kib = 2

[seeding]
ratio_enabled = false
ratio = 2.0
time_enabled = false
time_minutes = 1440
inactive_enabled = false
