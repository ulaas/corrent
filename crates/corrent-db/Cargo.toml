[package]
name = "corrent-db"
version = "0.3.2"
edition = "2024"
rust-version = "1.96"
description = "Corrent's SQLite database: writer thread, read pool, migrations"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
rusqlite = { version = "0.40", features = ["bundled"] }
tokio = { version = "1.53", features = ["rt", "sync"] }
tracing = "0.1"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
