[package]
name = "corrent-mpv"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Runtime-loaded libmpv bindings for Corrent (playback, probing, encoding)"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
libloading = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"

[dev-dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["glow", "default_fonts", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
