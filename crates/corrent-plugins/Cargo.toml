[package]
name = "corrent-plugins"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Corrent's plugin host: WASM components (wasmtime) with a capability-checked host API"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
wasmtime = { version = "49", default-features = false, features = ["runtime", "cranelift", "component-model", "std", "anyhow", "async"] }
wasmtime-wasi = { version = "49", default-features = false, features = ["p2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1"
tokio = { version = "1.53", features = ["rt", "sync", "time", "net", "process", "io-util", "macros"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
url = "2"
tracing = "0.1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1.53", features = ["rt-multi-thread", "macros"] }
