[package]
name = "corrent-transcode"
version = "0.3.1"
edition = "2024"
rust-version = "1.96"
description = "Corrent's playback decisions, HLS transcoding sessions (libmpv), subtitles and trickplay"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
corrent-mpv = { path = "../corrent-mpv" }
bytes = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53", features = ["rt", "sync", "process", "time", "fs", "macros", "io-util"] }
tracing = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
fs4 = "1.1.0"

[dev-dependencies]
corrent-fuzz = { path = "../corrent-fuzz" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "process", "time"] }
