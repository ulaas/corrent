[package]
name = "corrent-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Corrent's HTTP server: qBittorrent-compatible API, API v1, web client"
license = "MIT OR Apache-2.0"
publish = false

[features]
default = []
# Corrent Connect: reachable from anywhere through iroh (hole punching, relays).
p2p = ["dep:iroh", "dep:hyper", "dep:hyper-util", "dep:portmapper"]

[dependencies]
mdns-sd = { version = "0.21.5", default-features = false }
base64 = "0.22"
ed25519-dalek = { version = "3", default-features = false, features = ["alloc"] }
zip = { version = "9", default-features = false, features = ["deflate"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
corrent-core = { path = "../corrent-core" }
corrent-proto = { path = "../corrent-proto" }
corrent-i18n = { path = "../corrent-i18n" }
corrent-db = { path = "../corrent-db" }
corrent-library = { path = "../corrent-library" }
corrent-transcode = { path = "../corrent-transcode" }
corrent-plugins = { path = "../corrent-plugins" }
corrent-mpv = { path = "../corrent-mpv" }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", default-features = false, features = ["fs"] }
mime_guess = "2"
librqbit-dualstack-sockets = "0.7"
rustls = { version = "0.23", default-features = false, features = ["aws_lc_rs", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws_lc_rs", "tls12"] }
librqbit-upnp = "9.0.1"
rust-embed = "8"
argon2 = { version = "0.6", default-features = false, features = ["alloc"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "net"] }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio", "multipart", "json", "query", "form", "ws"] }
arc-swap = "1"
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
url = "2"
toml = "1"
flate2 = "1"
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
time = { version = "0.3", default-features = false, features = ["std"] }
if-addrs = "0.15"
axum-server = { version = "0.8", features = ["tls-rustls"] }
directories = "6"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "stream"] }
iroh = { version = "1.3", default-features = false, features = ["tls-aws-lc-rs", "portmapper"], optional = true }
hyper = { version = "1", features = ["server", "http1"], optional = true }
portmapper = { version = "0.19", default-features = false, optional = true }
hyper-util = { version = "0.1", features = ["tokio", "service"], optional = true }
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys"] }

[target."cfg(windows)".dependencies]
aws-lc-rs = { version = "1", default-features = false, features = ["aws-lc-sys", "prebuilt-nasm"] }

[dev-dependencies]
corrent-fuzz = { path = "../corrent-fuzz" }
image = { version = "0.25", default-features = false, features = ["png"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["connect"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
http-body-util = "0.1"
corrent-core = { path = "../corrent-core", features = ["testkit"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "form", "multipart", "json"] }
