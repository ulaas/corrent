[package]
name = "corrent-proto"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Corrent API v1 wire types"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[dependencies]
corrent-i18n = { path = "../corrent-i18n" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
corrent-fuzz = { path = "../corrent-fuzz" }
