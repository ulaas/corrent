[package]
name = "correntd"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
description = "Corrent's headless media and torrent server"
license = "MIT OR Apache-2.0"
publish = false

[lints]
workspace = true

[features]
default = ["acme"]
# Let's Encrypt certificates for `acme_domains` in server.toml.
acme = ["corrent-server/acme"]

[dependencies]
corrent-core = { path = "../corrent-core" }
corrent-db = { path = "../corrent-db" }
corrent-i18n = { path = "../corrent-i18n" }
corrent-server = { path = "../corrent-server", features = ["p2p"] }
corrent-library = { path = "../corrent-library" }
corrent-proto = { path = "../corrent-proto" }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
arc-swap = "1"
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "json"] }
serde_json = "1"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[target."cfg(windows)".dependencies]
windows-service = "0.8.1"
